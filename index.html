<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ironclad v13 - Digital Gain</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #00ffcc; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ffcc; padding: 30px; max-width: 650px; margin: auto; background: #0a0a0a; box-shadow: 0 0 20px #00ffcc; }
        textarea { width: 95%; height: 80px; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin: 10px 0; }
        .slider-wrap { margin: 20px 0; padding: 10px; border: 1px solid #333; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin: 10px; border-radius: 5px; }
        button:hover { background: #fff; }
        #res { background: #111; color: #00ffcc; padding: 15px; border: 1px solid #00ffcc; min-height: 40px; word-break: break-all; margin-top:10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>IRONCLAD v13 // DIGITAL GAIN</h2>
    
    <div class="slider-wrap">
        <label>DIGITAL GAIN (STRENGTH): </label>
        <input type="range" id="gain" min="20" max="120" value="80">
        <span id="gainVal">80</span>
    </div>

    <div style="border-bottom: 1px solid #222; padding-bottom: 20px;">
        <input type="file" id="fIn" accept="image/*"><br>
        <textarea id="tIn" placeholder="Enter message..."></textarea><br>
        <button onclick="process(true)">ENCODE WITH GAIN</button>
    </div>

    <div style="margin-top: 20px;">
        <input type="file" id="fDec" accept="image/*"><br>
        <button onclick="process(false)">DECODE SIGNAL</button>
        <div id="res">Waiting for signal...</div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const CLUSTER = 4; // 4x4 pixel clusters per bit
const SYNC = "1111000011110000"; 

document.getElementById('gain').oninput = function() {
    document.getElementById('gainVal').innerText = this.value;
};

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    const gain = parseInt(document.getElementById('gain').value);
    if (!input.files[0]) return alert("Select image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                let bin = SYNC + (document.getElementById('tIn').value + "##").split('').map(c => 
                    c.charCodeAt(0).toString(2).padStart(8, '0')
                ).join('');

                const cols = Math.floor(c.width / CLUSTER);

                for (let i = 0; i < bin.length; i++) {
                    let bit = bin[i] === "1";
                    let bCol = i % cols;
                    let bRow = Math.floor(i / cols);

                    for (let y = 0; y < CLUSTER; y++) {
                        for (let x = 0; x < CLUSTER; x++) {
                            let idx = (((bRow * CLUSTER) + y) * c.width + ((bCol * CLUSTER) + x)) * 4;
                            // Shift BLUE channel based on Gain
                            // We use Blue because JPEG compression smudges Red/Green first
                            if (bit) {
                                data[idx+2] = Math.min(255, data[idx+2] + gain);
                            } else {
                                data[idx+2] = Math.max(0, data[idx+2] - gain);
                            }
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'gain_encoded.png';
                link.href = c.toDataURL("image/png");
                link.click();
            } else {
                let fullBin = "";
                const cols = Math.floor(c.width / CLUSTER);
                const rows = Math.floor(c.height / CLUSTER);

                for (let r = 0; r < rows; r++) {
                    for (let col = 0; col < cols; col++) {
                        let avgB = 0;
                        for (let y = 0; y < CLUSTER; y++) {
                            for (let x = 0; x < CLUSTER; x++) {
                                avgB += data[(((r * CLUSTER) + y) * c.width + ((col * CLUSTER) + x)) * 4 + 2];
                            }
                        }
                        // Use a rolling threshold or middle point
                        fullBin += (avgB / (CLUSTER * CLUSTER) > 127) ? "1" : "0";
                    }
                    if (fullBin.length > 5000) break; 
                }

                const start = fullBin.indexOf(SYNC);
                if (start === -1) {
                    document.getElementById('res').innerText = "ERROR: Signal Lost in Noise.";
                    return;
                }

                let clean = fullBin.substring(start + SYNC.length);
                let out = "";
                for (let i = 0; i < clean.length; i += 8) {
                    let char = String.fromCharCode(parseInt(clean.substring(i, i + 8), 2));
                    out += char;
                    if (out.endsWith("##")) break;
                }
                document.getElementById('res').innerText = out.replace("##", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
