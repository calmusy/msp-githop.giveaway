<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deep-Sea Synth v14</title>
    <style>
        body { font-family: monospace; background: #000; color: #00ffcc; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ffcc; padding: 25px; max-width: 600px; margin: auto; background: #050505; }
        textarea { width: 95%; height: 60px; background: #111; color: #fff; border: 1px solid #333; margin: 10px 0; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; margin: 5px; }
        .status { color: #ff00ff; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>DEEP-SEA SYNTH v14</h2>
    <div id="status" class="status">READY</div>

    <input type="file" id="fIn" accept="image/*"><br>
    <textarea id="tIn" placeholder="Enter message..."></textarea><br>
    <button onclick="run(true)">ENCODE FOR INSTA</button>

    <hr style="border:0; border-top:1px solid #222; margin:20px 0;">

    <input type="file" id="fDec" accept="image/*"><br>
    <button onclick="run(false)">DECODE INSTA IMAGE</button>
    <div id="res" style="background:#111; padding:10px; border:1px solid #333; margin-top:10px;">...</div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const CLUSTER = 8; // Larger clusters to survive JPEG "smudge"
const SYNC_BIT = "11110000";

function run(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    const status = document.getElementById('status');
    if (!input.files[0]) return alert("Upload image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            // Force standard dimensions to prevent scaling errors
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                let bin = SYNC_BIT + (document.getElementById('tIn').value + "##").split('').map(c => 
                    c.charCodeAt(0).toString(2).padStart(8, '0')
                ).join('');

                const cols = Math.floor(c.width / CLUSTER);

                for (let i = 0; i < bin.length; i++) {
                    let bit = bin[i] === "1";
                    let bCol = i % cols;
                    let bRow = Math.floor(i / cols);

                    for (let y = 0; y < CLUSTER; y++) {
                        for (let x = 0; x < CLUSTER; x++) {
                            let idx = (((bRow * CLUSTER) + y) * c.width + ((bCol * CLUSTER) + x)) * 4;
                            // Sledgehammer all channels for maximum JPEG survival
                            let val = bit ? 255 : 0;
                            data[idx] = val;
                            data[idx+1] = val;
                            data[idx+2] = val;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'for_insta.png';
                link.href = c.toDataURL("image/png");
                link.click();
                status.innerText = "ENCODE DONE";
            } else {
                let fullBin = "";
                const cols = Math.floor(c.width / CLUSTER);
                
                for (let i = 0; i < 2000; i++) {
                    let bCol = i % cols;
                    let bRow = Math.floor(i / cols);
                    let sum = 0;

                    for (let y = 0; y < CLUSTER; y++) {
                        for (let x = 0; x < CLUSTER; x++) {
                            let idx = (((bRow * CLUSTER) + y) * c.width + ((bCol * CLUSTER) + x)) * 4;
                            sum += (data[idx] + data[idx+1] + data[idx+2]) / 3;
                        }
                    }
                    // Adaptive Threshold: JPEG often turns 0 into 20 and 255 into 230
                    fullBin += (sum / (CLUSTER * CLUSTER) > 120) ? "1" : "0";
                }

                const start = fullBin.indexOf(SYNC_BIT);
                if (start === -1) {
                    document.getElementById('res').innerText = "ERROR: Anchor Lost.";
                    return;
                }

                let clean = fullBin.substring(start + SYNC_BIT.length);
                let out = "";
                for (let i = 0; i < clean.length; i += 8) {
                    let byte = clean.substring(i, i + 8);
                    if (byte.length < 8) break;
                    let char = String.fromCharCode(parseInt(byte, 2));
                    out += char;
                    if (out.endsWith("##")) break;
                }
                document.getElementById('res').innerText = out.replace("##", "");
                status.innerText = "DECODE COMPLETE";
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
