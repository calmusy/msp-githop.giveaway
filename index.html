<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rugged Synth v7 - Final Fix</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #00ff41; padding: 20px; text-align: center; }
        .box { border: 2px solid #00ff41; padding: 30px; max-width: 650px; margin: auto; background: #000; box-shadow: 0 0 20px #00ff41; border-radius: 10px; }
        textarea { width: 95%; height: 80px; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 10px; margin: 10px 0; font-size: 14px; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin: 10px; border-radius: 5px; }
        button:hover { background: #fff; }
        #status { color: #ff00ea; font-weight: bold; margin: 10px; }
        .result-area { background: #222; color: #fff; padding: 15px; border: 1px dashed #00ff41; min-height: 50px; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h2>RUGGED PIXEL SYNTH v7</h2>
    <div id="status">READY</div>

    <div style="border-bottom: 1px solid #333; padding-bottom: 20px;">
        <h3>ENCODE (Create Secret)</h3>
        <input type="file" id="fIn" accept="image/*"><br>
        <textarea id="tIn" placeholder="Type your secret message..."></textarea><br>
        <button onclick="process(true)">ENCODE & DOWNLOAD PNG</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>DECODE (Read Secret)</h3>
        <input type="file" id="fDec" accept="image/*"><br>
        <button onclick="process(false)">DECODE IMAGE</button>
        <div class="result-area" id="res">Message will appear here...</div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const STEP = 8; // How many pixels to skip (survives compression)
const THRESHOLD = 128;

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    const status = document.getElementById('status');
    
    if (!input.files[0]) return alert("Select an image!");
    status.innerText = "PROCESSING...";

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                const msg = document.getElementById('tIn').value + "@@"; // Simpler terminator
                let bitIdx = 0;

                for (let i = 0; i < msg.length; i++) {
                    let charCode = msg.charCodeAt(i);
                    for (let b = 7; b >= 0; b--) {
                        let bit = (charCode >> b) & 1;
                        let pos = bitIdx * STEP * 4;
                        
                        if (pos + 3 >= data.length) break;

                        // Force the pixel value to be clearly High or Low
                        // This survives the "averaging" of Instagram's compression
                        data[pos] = bit === 1 ? 255 : 0; 
                        bitIdx++;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'rugged_v7.png';
                link.href = c.toDataURL("image/png");
                link.click();
                status.innerText = "ENCODED SUCCESSFULLY";
            } else {
                let bin = "";
                let out = "";
                for (let i = 0; i < data.length; i += (STEP * 4)) {
                    // Check if the Red channel is closer to 255 or 0
                    bin += (data[i] > THRESHOLD) ? "1" : "0";
                    
                    if (bin.length === 8) {
                        let char = String.fromCharCode(parseInt(bin, 2));
                        out += char;
                        bin = "";
                        if (out.endsWith("@@")) break;
                    }
                    if (out.length > 1000) break;
                }
                document.getElementById('res').innerText = out.replace("@@", "");
                status.innerText = "DECODE COMPLETE";
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
