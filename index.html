<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synth-Lite v12</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #00ffcc; text-align: center; padding: 20px; }
        .box { border: 1px solid #00ffcc; padding: 20px; max-width: 600px; margin: auto; background: #111; }
        textarea { width: 90%; height: 60px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #444; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #res { color: #fff; background: #222; margin-top: 10px; padding: 10px; border: 1px dashed #00ffcc; }
    </style>
</head>
<body>

<div class="box">
    <h2>SYNTH-LITE v12 // FREQUENCY MAPPING</h2>
    <p style="font-size: 0.7em; color: #666;">// LOW VISIBILITY - HIGH STABILITY //</p>

    <input type="file" id="fIn" accept="image/*"><br>
    <textarea id="tIn" placeholder="Enter secret message..."></textarea><br>
    <button onclick="process(true)">ENCODE & DOWNLOAD</button>

    <hr style="border:0; border-top:1px solid #333; margin:20px 0;">

    <input type="file" id="fDec" accept="image/*"><br>
    <button onclick="process(false)">DECODE SIGNAL</button>
    <div id="res">Waiting for signal...</div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const BIT_SIZE = 4; // Cluster size for stability
const THRESHOLD = 127;
const SYNC_PATTERN = "1111000010101010"; // Calibration Header

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    if (!input.files[0]) return alert("Select image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                let msg = document.getElementById('tIn').value + "##";
                let bin = SYNC_PATTERN;
                for (let i = 0; i < msg.length; i++) {
                    bin += msg.charCodeAt(i).toString(2).padStart(8, '0');
                }

                // We encode in the BLUE channel (least visible to humans)
                for (let i = 0; i < bin.length; i++) {
                    let bit = bin[i] === "1";
                    let pos = i * BIT_SIZE * 4;
                    if (pos + 2 >= data.length) break;

                    // Instead of blocks, we nudge the blue channel value
                    // to be either clearly HIGH (>200) or clearly LOW (<50)
                    for (let j = 0; j < BIT_SIZE; j++) {
                        let idx = (i * BIT_SIZE + j) * 4 + 2; // +2 is Blue channel
                        data[idx] = bit ? 240 : 15;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'synth_v12.png';
                link.href = c.toDataURL("image/png");
                link.click();
            } else {
                let fullBin = "";
                for (let i = 0; i < data.length / 4; i += BIT_SIZE) {
                    let avgBlue = 0;
                    for (let j = 0; j < BIT_SIZE; j++) {
                        avgBlue += data[(i + j) * 4 + 2];
                    }
                    fullBin += (avgBlue / BIT_SIZE > THRESHOLD) ? "1" : "0";
                }

                const start = fullBin.indexOf(SYNC_PATTERN);
                if (start === -1) {
                    document.getElementById('res').innerText = "ERROR: Calibration Lost.";
                    return;
                }

                let cleanBin = fullBin.substring(start + SYNC_PATTERN.length);
                let out = "";
                for (let i = 0; i < cleanBin.length; i += 8) {
                    let byte = cleanBin.substring(i, i + 8);
                    if (byte.length < 8) break;
                    let char = String.fromCharCode(parseInt(byte, 2));
                    out += char;
                    if (out.endsWith("##")) break;
                }
                document.getElementById('res').innerText = out.replace("##", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
