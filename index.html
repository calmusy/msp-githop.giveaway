<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ironclad v11 - Loop & Block</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #00ff41; padding: 20px; text-align: center; }
        .box { border: 2px solid #00ff41; padding: 30px; max-width: 650px; margin: auto; background: #0a0a0a; box-shadow: 0 0 20px #00ff41; }
        textarea { width: 95%; height: 80px; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin: 10px 0; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin: 10px; border-radius: 5px; }
        .res-area { background: #111; color: #00ff41; padding: 15px; border: 1px solid #00ff41; min-height: 40px; word-break: break-all; margin-top:10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>IRONCLAD v11 // LOOP & BLOCK</h2>
    <p style="font-size: 0.8em; color: #888;">// TRIPLE REDUNDANCY MODE ACTIVE //</p>

    <div style="border-bottom: 1px solid #222; padding-bottom: 20px;">
        <input type="file" id="fIn" accept="image/*"><br>
        <textarea id="tIn" placeholder="Type secret message..."></textarea><br>
        <button onclick="process(true)">ENCODE (STRONG)</button>
    </div>

    <div style="margin-top: 20px;">
        <input type="file" id="fDec" accept="image/*"><br>
        <button onclick="process(false)">DECODE (EXTRACT)</button>
        <div class="res-area" id="res">Waiting...</div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const B_SIZE = 8; // 8x8 blocks (survives blur)
const SHIFT = 50; // Heavy brightness shift

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    if (!input.files[0]) return alert("Select an image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                const marker = "11001100"; 
                let msg = document.getElementById('tIn').value + "##";
                let bin = marker;
                for (let i = 0; i < msg.length; i++) {
                    bin += msg.charCodeAt(i).toString(2).padStart(8, '0');
                }

                // LOOP: We write the message 3 times in different vertical zones
                const zones = [0.2, 0.5, 0.8]; // 20%, 50%, 80% down the image
                
                zones.forEach(zoneY => {
                    let startY = Math.floor(c.height * zoneY);
                    for (let i = 0; i < bin.length; i++) {
                        let bit = bin[i] === "1";
                        let xBase = (i * B_SIZE) % (c.width - B_SIZE);
                        let yBase = startY + Math.floor((i * B_SIZE) / c.width) * B_SIZE;

                        if (yBase + B_SIZE >= c.height) break;

                        for (let y = 0; y < B_SIZE; y++) {
                            for (let x = 0; x < B_SIZE; x++) {
                                let idx = ((yBase + y) * c.width + (xBase + x)) * 4;
                                // Shift Red and Blue channels for high visibility to the decoder
                                data[idx] = bit ? Math.min(255, data[idx] + SHIFT) : Math.max(0, data[idx] - SHIFT);
                                data[idx+2] = bit ? Math.min(255, data[idx+2] + SHIFT) : Math.max(0, data[idx+2] - SHIFT);
                            }
                        }
                    }
                });

                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'ironclad_v11.png';
                link.href = c.toDataURL("image/png");
                link.click();
            } else {
                let bestResult = "ERROR: No marker found.";
                const zones = [0.2, 0.5, 0.8];

                for (let zoneY of zones) {
                    let fullBin = "";
                    let startY = Math.floor(c.height * zoneY);
                    
                    for (let i = 0; i < 2000; i++) { // Scan up to 2000 bits per zone
                        let xBase = (i * B_SIZE) % (c.width - B_SIZE);
                        let yBase = startY + Math.floor((i * B_SIZE) / c.width) * B_SIZE;
                        if (yBase + B_SIZE >= c.height) break;

                        let avgR = 0;
                        for (let y = 0; y < B_SIZE; y++) {
                            for (let x = 0; x < B_SIZE; x++) {
                                avgR += data[((yBase + y) * c.width + (xBase + x)) * 4];
                            }
                        }
                        fullBin += (avgR / (B_SIZE * B_SIZE) > 127) ? "1" : "0";
                    }

                    const marker = "11001100";
                    const start = fullBin.indexOf(marker);
                    if (start !== -1) {
                        let cleanBin = fullBin.substring(start + marker.length);
                        let final = "";
                        for (let i = 0; i < cleanBin.length; i += 8) {
                            let char = String.fromCharCode(parseInt(cleanBin.substring(i, i + 8), 2));
                            final += char;
                            if (final.endsWith("##")) break;
                        }
                        if (final.includes("##")) {
                            bestResult = final.replace("##", "");
                            break; // Found it!
                        }
                    }
                }
                document.getElementById('res').innerText = bestResult;
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
