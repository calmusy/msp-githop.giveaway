<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ironclad Synth v10</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #00ff00; text-align: center; padding: 20px; }
        .container { border: 2px solid #00ff00; padding: 20px; max-width: 600px; margin: auto; background: #111; }
        textarea { width: 90%; height: 60px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #333; }
        button { background: #00ff00; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #log { font-family: monospace; font-size: 12px; color: #888; margin-top: 15px; }
        .res { color: white; background: #222; padding: 10px; margin-top: 10px; border: 1px dashed #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <h2>IRONCLAD PIXEL SYNTH v10</h2>
    
    <div>
        <input type="file" id="fileIn" accept="image/*"><br>
        <textarea id="textIn" placeholder="Enter secret message..."></textarea><br>
        <button onclick="run(true)">ENCODE & DOWNLOAD</button>
    </div>

    <hr style="border:0; border-top:1px solid #333; margin:20px 0;">

    <div>
        <input type="file" id="fileDec" accept="image/*"><br>
        <button onclick="run(false)">DECODE IMAGE</button>
        <div class="res" id="result">Waiting...</div>
    </div>
    <div id="log"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const CLUSTER = 2; // 2x2 pixels per bit for stability
const START_X = 10; // Margin to avoid edge-cropping

function run(isEncode) {
    const input = isEncode ? document.getElementById('fileIn') : document.getElementById('fileDec');
    if (!input.files[0]) return alert("Select an image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const cvs = document.getElementById('canvas');
            const ctx = cvs.getContext('2d');
            cvs.width = img.width;
            cvs.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
            const data = imgData.data;

            if (isEncode) {
                const marker = "10101010"; // Simple start sync
                let secret = document.getElementById('textIn').value + "##";
                let bin = marker;
                for (let i = 0; i < secret.length; i++) {
                    bin += secret.charCodeAt(i).toString(2).padStart(8, '0');
                }

                for (let i = 0; i < bin.length; i++) {
                    let bit = bin[i] === "1";
                    // Calculate a linear position (moving across rows)
                    let xBase = START_X + (i * CLUSTER);
                    let yBase = 2; // Hide it in the 2nd row of pixels

                    if (xBase + CLUSTER >= cvs.width) {
                        yBase += CLUSTER; // Move to next row if too wide
                        xBase = START_X;
                    }

                    for (let dy = 0; dy < CLUSTER; dy++) {
                        for (let dx = 0; dx < CLUSTER; dx++) {
                            let idx = ((yBase + dy) * cvs.width + (xBase + dx)) * 4;
                            // Force RGB to absolute Max or Min
                            let val = bit ? 255 : 0;
                            data[idx] = val;     // R
                            data[idx+1] = val;   // G
                            data[idx+2] = val;   // B
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'ironclad_secret.png';
                link.href = cvs.toDataURL("image/png");
                link.click();
            } else {
                let fullBin = "";
                // Scan the top rows for bits
                for (let y = 2; y < 20; y += CLUSTER) {
                    for (let x = START_X; x < cvs.width - CLUSTER; x += CLUSTER) {
                        let rIdx = (y * cvs.width + x) * 4;
                        // Use the Red channel average of the cluster
                        fullBin += (data[rIdx] > 127) ? "1" : "0";
                    }
                }

                const marker = "10101010";
                const start = fullBin.indexOf(marker);
                if (start === -1) {
                    document.getElementById('result').innerText = "ERROR: Marker Not Found.";
                    return;
                }

                let cleanBin = fullBin.substring(start + marker.length);
                let msg = "";
                for (let i = 0; i < cleanBin.length; i += 8) {
                    let charCode = parseInt(cleanBin.substring(i, i + 8), 2);
                    if (isNaN(charCode)) break;
                    let char = String.fromCharCode(charCode);
                    msg += char;
                    if (msg.endsWith("##")) break;
                }
                document.getElementById('result').innerText = msg.replace("##", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
