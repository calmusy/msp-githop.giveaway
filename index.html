<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ironclad v15 - Auto-Sync</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #00ffcc; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ffcc; padding: 25px; max-width: 650px; margin: auto; background: #0a0a0a; border-radius: 15px; }
        textarea { width: 95%; height: 70px; background: #111; color: #fff; border: 1px solid #333; margin: 10px 0; border-radius: 5px; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; margin: 5px; border-radius: 8px; }
        .res-area { background: #111; color: #fff; padding: 15px; border: 1px dashed #00ffcc; min-height: 40px; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h2>IRONCLAD v15 (AUTO-SYNC)</h2>
    <p style="font-size: 0.8em; color: #888;">// DEFEATS RESIZING & CROPPING //</p>

    <input type="file" id="fIn" accept="image/*"><br>
    <textarea id="tIn" placeholder="Enter message..."></textarea><br>
    <button onclick="process(true)">ENCODE & DOWNLOAD</button>

    <hr style="border: 0; border-top: 1px solid #222; margin: 20px 0;">

    <input type="file" id="fDec" accept="image/*"><br>
    <button onclick="process(false)">DECODE (SCAN MODE)</button>
    <div class="res-area" id="res">Waiting for signal...</div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
const B_SIZE = 8; // Block size
const SYNC_HEX = "1111000011110000"; // Our unique "Radio Signal"

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    if (!input.files[0]) return alert("Select an image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                let bin = SYNC_HEX + (document.getElementById('tIn').value + "##").split('').map(c => 
                    c.charCodeAt(0).toString(2).padStart(8, '0')
                ).join('');

                const cols = Math.floor(c.width / B_SIZE);

                for (let i = 0; i < bin.length; i++) {
                    let bit = bin[i] === "1";
                    let bCol = i % cols;
                    let bRow = Math.floor(i / cols);

                    for (let y = 0; y < B_SIZE; y++) {
                        for (let x = 0; x < B_SIZE; x++) {
                            let idx = (((bRow * B_SIZE) + y) * c.width + ((bCol * B_SIZE) + x)) * 4;
                            let val = bit ? 255 : 0;
                            data[idx] = val; data[idx+1] = val; data[idx+2] = val;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'ironclad_v15.png';
                link.href = c.toDataURL("image/png");
                link.click();
            } else {
                let fullBin = "";
                // SCAN MODE: We look at the top 30 pixels for the start of the pattern
                // to handle any cropping or stretching Instagram did.
                let bestStart = -1;
                
                // We scan every pixel in the top area to find the "edge" of our blocks
                for (let startOffset = 0; startOffset < 1000; startOffset += 4) {
                    let testVal = data[startOffset] > 127 ? "1" : "0";
                    fullBin += testVal;
                    
                    if (fullBin.endsWith(SYNC_HEX)) {
                        bestStart = startOffset;
                        break;
                    }
                }

                if (bestStart === -1) {
                    document.getElementById('res').innerText = "ERROR: Could not sync with image grid.";
                    return;
                }

                // Now we know EXACTLY where the data starts, even if shifted!
                let messageBin = "";
                let startIndex = (bestStart / 4) + 1; // Start right after the sync header
                
                // Read from the found anchor point
                for (let i = 0; i < 500; i++) { // Read next 500 bits
                    let idx = (startIndex + (i * B_SIZE)) * 4;
                    if (idx >= data.length) break;
                    messageBin += (data[idx] > 127) ? "1" : "0";
                }

                let finalStr = "";
                for (let i = 0; i < messageBin.length; i += 8) {
                    let byte = messageBin.substring(i, i + 8);
                    if (byte.length < 8) break;
                    let char = String.fromCharCode(parseInt(byte, 2));
                    finalStr += char;
                    if (finalStr.endsWith("##")) break;
                }
                document.getElementById('res').innerText = finalStr.replace("##", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
