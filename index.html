<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mathematical Noise & Color Matcher</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #ddd; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-container { background: #1a1a1a; padding: 25px; border-radius: 12px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .control-group { background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        label { display: block; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; color: #aaa; margin-bottom: 10px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4f46e5; }
        canvas { display: block; margin: 20px auto; max-width: 100%; border: 2px solid #333; background: #000; image-rendering: pixelated; }
        .btn-main { background: #4f46e5; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main:hover { background: #6366f1; }
        .status { text-align: center; font-size: 0.75rem; margin-top: 10px; color: #666; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <div class="control-group">
            <label>1. Upload Image</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div class="control-group">
            <label>Color Match Sensitivity: <span id="v1">0</span></label>
            <input type="range" id="matchRadius" min="0" max="150" value="0">
        </div>
        <div class="control-group">
            <label>Noise Strength: <span id="v2">0</span>%</label>
            <input type="range" id="noiseStr" min="0" max="100" value="0">
        </div>
        <div class="control-group">
            <label>Pixel Erosion (White): <span id="v3">0</span>%</label>
            <input type="range" id="erosion" min="0" max="100" value="0">
        </div>
    </div>
    
    <button class="btn-main" id="processBtn">Apply Changes</button>
    <p class="status" id="status">No image loaded.</p>
    <canvas id="canvas"></canvas>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let originalImg = null;    // The absolute original
    let matchedImg = null;     // The color-matched version (Intermediate)

    // UI Updates
    const update = (id, target) => {
        document.getElementById(id).oninput = (e) => {
            document.getElementById(target).innerText = e.target.value;
        };
    };
    update('matchRadius', 'v1');
    update('noiseStr', 'v2');
    update('erosion', 'v3');

    upload.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (f) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
                matchedImg = null; // Reset matched image on new upload
                document.getElementById('status').innerText = `Loaded ${img.width}x${img.height}px`;
            };
            img.src = f.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('processBtn').onclick = () => {
        if (!originalImg) return;

        const sensitivity = parseInt(document.getElementById('matchRadius').value);
        const noiseAmt = parseInt(document.getElementById('noiseStr').value);
        const erosionAmt = parseInt(document.getElementById('erosion').value);

        // --- STEP 1: COLOR MATCHING (The Math Logic) ---
        // We only re-calculate this if sensitivity is > 0
        let workingData = new Uint8ClampedArray(originalImg.data);

        if (sensitivity > 0) {
            let colors = {};
            for (let i = 0; i < workingData.length; i += 4) {
                let k = (workingData[i] << 16) | (workingData[i+1] << 8) | workingData[i+2];
                colors[k] = (colors[k] || 0) + 1;
            }
            let sorted = Object.keys(colors).map(Number).sort((a,b) => colors[b] - colors[a]);
            let palette = [];
            let map = new Map();

            sorted.forEach(c => {
                let r1 = (c >> 16) & 0xff, g1 = (c >> 8) & 0xff, b1 = c & 0xff;
                let found = palette.find(p => {
                    let r2 = (p >> 16) & 0xff, g2 = (p >> 8) & 0xff, b2 = p & 0xff;
                    // Euclidean Distance formula per user request
                    return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2) < sensitivity;
                });
                if (found) map.set(c, found);
                else { palette.push(c); map.set(c, c); }
            });

            for (let i = 0; i < workingData.length; i += 4) {
                let k = (workingData[i] << 16) | (workingData[i+1] << 8) | workingData[i+2];
                let mc = map.get(k);
                workingData[i] = (mc >> 16) & 0xff;
                workingData[i+1] = (mc >> 8) & 0xff;
                workingData[i+2] = mc & 0xff;
            }
        }

        // --- STEP 2: NOISE & EROSION ---
        // Apply this to the "workingData" (the result of Step 1)
        for (let i = 0; i < workingData.length; i += 4) {
            const chance = Math.random() * 100;

            // Erosion (turning pixels white)
            if (erosionAmt > 0 && chance < erosionAmt) {
                workingData[i] = workingData[i+1] = workingData[i+2] = 255;
                continue;
            }

            // High-Intensity Noise (0 to MAX)
            if (noiseAmt > 0) {
                // Generates a value between -scale and +scale based on slider
                const scale = (noiseAmt / 100) * 128;
                const rN = (Math.random() - 0.5) * 2 * scale;
                const gN = (Math.random() - 0.5) * 2 * scale;
                const bN = (Math.random() - 0.5) * 2 * scale;

                workingData[i]   = Math.max(0, Math.min(255, workingData[i] + rN));
                workingData[i+1] = Math.max(0, Math.min(255, workingData[i+1] + gN));
                workingData[i+2] = Math.max(0, Math.min(255, workingData[i+2] + bN));
            }
        }

        ctx.putImageData(new ImageData(workingData, canvas.width, canvas.height), 0, 0);
        document.getElementById('status').innerText = `Processed with sensitivity ${sensitivity}`;
    };
</script>

</body>
</html>
