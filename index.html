<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Synth v8 - Ultra Stable</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; padding: 20px; text-align: center; }
        .box { border: 2px solid #00ff41; padding: 30px; max-width: 650px; margin: auto; background: #000; box-shadow: 0 0 20px #00ff41; }
        textarea { width: 95%; height: 80px; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin: 10px 0; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin: 10px; }
        .res-area { background: #111; color: #00ff41; padding: 15px; border: 1px solid #00ff41; min-height: 40px; word-break: break-all; margin-top:10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>PIXEL SYNTH v8 (ULTRA-STABLE)</h2>
    <p style="font-size: 0.8em; color: #888;">// USES SYNC-MARKER FOR ALIGNMENT //</p>

    <div style="border-bottom: 1px solid #222; padding-bottom: 20px;">
        <input type="file" id="fIn" accept="image/*"><br>
        <textarea id="tIn" placeholder="Type secret message..."></textarea><br>
        <button onclick="process(true)">ENCODE & DOWNLOAD</button>
    </div>

    <div style="margin-top: 20px;">
        <input type="file" id="fDec" accept="image/*"><br>
        <button onclick="process(false)">DECODE IMAGE</button>
        <div class="res-area" id="res">Waiting...</div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
// We use a specific 16-bit pattern to "wake up" the decoder
const SYNC_MARKER = "1100110011001100"; 
const STEP = 4; 

function process(isEncode) {
    const input = isEncode ? document.getElementById('fIn') : document.getElementById('fDec');
    if (!input.files[0]) return alert("Select an image!");

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = img.width;
            c.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;

            if (isEncode) {
                let text = document.getElementById('tIn').value + "##";
                let binaryMsg = "";
                
                // Convert text to binary
                for (let i = 0; i < text.length; i++) {
                    binaryMsg += text.charCodeAt(i).toString(2).padStart(8, '0');
                }
                
                // Total string to hide = Marker + Message
                const finalBits = SYNC_MARKER + binaryMsg;

                for (let i = 0; i < finalBits.length; i++) {
                    let pos = i * STEP * 4;
                    if (pos >= data.length) break;
                    // Force Red channel to 255 for '1', 0 for '0'
                    data[pos] = finalBits[i] === "1" ? 255 : 0;
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'synth_v8.png';
                link.href = c.toDataURL("image/png");
                link.click();
            } else {
                let fullBinary = "";
                // Read the whole image into a bitstring
                for (let i = 0; i < data.length; i += (STEP * 4)) {
                    fullBinary += (data[i] > 127) ? "1" : "0";
                }

                // Find where our SYNC_MARKER starts
                const startIdx = fullBinary.indexOf(SYNC_MARKER);
                if (startIdx === -1) {
                    document.getElementById('res').innerText = "ERROR: No marker found.";
                    return;
                }

                const msgBinary = fullBinary.substring(startIdx + SYNC_MARKER.length);
                let finalStr = "";
                for (let i = 0; i < msgBinary.length; i += 8) {
                    let byte = msgBinary.substring(i, i + 8);
                    if (byte.length < 8) break;
                    let char = String.fromCharCode(parseInt(byte, 2));
                    finalStr += char;
                    if (finalStr.endsWith("##")) break;
                }
                document.getElementById('res').innerText = finalStr.replace("##", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
