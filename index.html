<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Pixel Synth v4</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0e0e0e; color: #00ffcc; text-align: center; padding: 40px; }
        .wrapper { border: 2px solid #00ffcc; border-radius: 20px; padding: 30px; max-width: 600px; margin: auto; background: #161616; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); }
        textarea { width: 90%; height: 100px; background: #222; color: #fff; border: 1px solid #444; border-radius: 10px; padding: 10px; margin: 15px 0; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { transform: scale(1.05); background: #fff; }
        .output-box { margin-top: 20px; padding: 15px; background: #000; border-radius: 10px; border: 1px dashed #00ffcc; min-height: 40px; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>PIXEL SYNTH v4.0</h2>
    <p>Enhanced Stability Mode</p>

    <div>
        <input type="file" id="imgIn" accept="image/*">
        <textarea id="secretMsg" placeholder="Type your message..."></textarea>
        <button onclick="run(true)">EMBED MESSAGE</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

    <div>
        <input type="file" id="imgDecode" accept="image/*">
        <button onclick="run(false)">DECODE IMAGE</button>
        <div class="output-box" id="result">Waiting for input...</div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
    const OFFSET = 10; // The "Strength" of the shift

    function run(encode) {
        const file = encode ? document.getElementById('imgIn').files[0] : document.getElementById('imgDecode').files[0];
        if (!file) return alert("Select an image first!");

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const c = document.getElementById('c');
                const ctx = c.getContext('2d');
                c.width = img.width;
                c.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, c.width, c.height);
                const data = imgData.data;

                if (encode) {
                    const msg = document.getElementById('secretMsg').value + "###";
                    let bitIndex = 0;
                    // We use a grid: every 4th pixel to avoid "clumping"
                    for (let i = 0; i < data.length && bitIndex < msg.length * 8; i += 16) {
                        const charPos = Math.floor(bitIndex / 8);
                        const bitPos = 7 - (bitIndex % 8);
                        const bit = (msg.charCodeAt(charPos) >> bitPos) & 1;

                        // Shift Red channel based on bit
                        if (bit === 1) {
                            data[i] = data[i] > 128 ? data[i] - OFFSET : data[i] + OFFSET;
                        }
                        bitIndex++;
                    }
                    ctx.putImageData(imgData, 0, 0);
                    const link = document.createElement('a');
                    link.download = 'synth_export.png';
                    link.href = c.toDataURL("image/png");
                    link.click();
                } else {
                    let binary = "";
                    let finalMsg = "";
                    for (let i = 0; i < data.length; i += 16) {
                        // Logic: check if the pixel is "off-balance"
                        // This is a simplified check for the offset we added
                        binary += (data[i] % 2 === 1) ? "1" : "0"; 
                        
                        if (binary.length === 8) {
                            let char = String.fromCharCode(parseInt(binary, 2));
                            finalMsg += char;
                            binary = "";
                            if (finalMsg.endsWith("###")) break;
                        }
                    }
                    document.getElementById('result').innerText = finalMsg.replace("###", "");
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
