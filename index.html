<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Synth Encoder</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff41; padding: 20px; text-align: center; }
        .box { border: 1px solid #00ff41; padding: 20px; max-width: 700px; margin: auto; background: #000; box-shadow: 0 0 15px #00ff41; }
        input, textarea { background: #111; color: #00ff41; border: 1px solid #00ff41; padding: 10px; width: 80%; margin: 10px 0; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 10px; }
        button:hover { background: #008f11; }
        img { max-width: 100%; border: 1px solid #333; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>PIXEL SYNTH v2.0</h2>
    <p>// SECURE DATA FRAGMENTATION //</p>

    <div style="border-bottom: 1px dotted #00ff41; padding-bottom: 20px;">
        <h3>ENCODE MESSAGE</h3>
        <input type="file" id="inputImg" accept="image/png">
        <textarea id="msg" placeholder="Enter secret transmission..."></textarea>
        <button onclick="process(true)">EMBED & GENERATE</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>DECODE IMAGE</h3>
        <input type="file" id="decodeImg" accept="image/png">
        <button onclick="process(false)">EXTRACT DATA</button>
        <p>OUTPUT: <span id="output" style="color: white; background: #222;">...</span></p>
    </div>
</div>

<canvas id="cvs" class="hidden"></canvas>

<script>
    // A simple seeded random to simulate the "Logic" 
    function seededRandom(seed) {
        return function() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        };
    }

    function process(isEncoding) {
        const file = isEncoding ? document.getElementById('inputImg').files[0] : document.getElementById('decodeImg').files[0];
        if (!file) return alert("Select an image first!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const cvs = document.getElementById('cvs');
                const ctx = cvs.getContext('2d');
                cvs.width = img.width;
                cvs.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
                const pixels = imgData.data;
                const rand = seededRandom(42); // The "Key" (The Logic)

                if (isEncoding) {
                    const text = document.getElementById('msg').value + "@@@"; // End marker
                    for (let i = 0; i < text.length; i++) {
                        let charCode = text.charCodeAt(i);
                        for (let bit = 0; bit < 8; bit++) {
                            // Find a "random" pixel index based on the seed
                            let targetPixel = Math.floor(rand() * (pixels.length / 4)) * 4;
                            let bitValue = (charCode >> (7 - bit)) & 1;
                            
                            // Change the color value by exactly 1 unit (invisible)
                            pixels[targetPixel] = (pixels[targetPixel] & 0xFE) | bitValue;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    const link = document.createElement('a');
                    link.download = 'secret_pixel.png';
                    link.href = cvs.toDataURL("image/png");
                    link.click();
                } else {
                    let extracted = "";
                    let charCode = 0;
                    for (let i = 0; i < 5000; i++) { // Scan up to 5000 bits
                        let targetPixel = Math.floor(rand() * (pixels.length / 4)) * 4;
                        charCode = (charCode << 1) | (pixels[targetPixel] & 1);

                        if ((i + 1) % 8 === 0) {
                            let char = String.fromCharCode(charCode);
                            extracted += char;
                            if (extracted.endsWith("@@@")) break;
                            charCode = 0;
                        }
                    }
                    document.getElementById('output').innerText = extracted.replace("@@@","");
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
