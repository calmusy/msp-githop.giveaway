<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Synth v5 - Stable</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #00ff41; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ff41; padding: 20px; max-width: 600px; margin: auto; background: #000; }
        textarea { width: 90%; height: 60px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #output { color: white; background: #222; padding: 10px; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>STABLE PIXEL ENCODER</h2>
    
    <div>
        <h3>1. Create Image</h3>
        <input type="file" id="fileIn" accept="image/*"><br>
        <textarea id="textIn" placeholder="Enter secret message..."></textarea><br>
        <button onclick="handle(true)">DOWNLOAD ENCODED PNG</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <div>
        <h3>2. Read Image</h3>
        <input type="file" id="fileDecode" accept="image/*"><br>
        <button onclick="handle(false)">EXTRACT MESSAGE</button>
        <div id="output">Result will appear here...</div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
function handle(isEncode) {
    const input = isEncode ? document.getElementById('fileIn') : document.getElementById('fileDecode');
    if (!input.files[0]) return alert("Select an image!");

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const cvs = document.getElementById('canvas');
            const ctx = cvs.getContext('2d');
            cvs.width = img.width;
            cvs.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
            const data = imgData.data;

            if (isEncode) {
                const secret = document.getElementById('textIn').value + "###"; // Terminator
                let bitIdx = 0;
                
                for (let i = 0; i < secret.length; i++) {
                    let charCode = secret.charCodeAt(i);
                    for (let b = 7; b >= 0; b--) {
                        let bit = (charCode >> b) & 1;
                        let pixelPos = bitIdx * 4; // Using Red channel of every pixel
                        
                        // If bit is 1, make value ODD. If 0, make value EVEN.
                        if (bit === 1) {
                            if (data[pixelPos] % 2 === 0) data[pixelPos]++;
                        } else {
                            if (data[pixelPos] % 2 !== 0) data[pixelPos]--;
                        }
                        bitIdx++;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                const link = document.createElement('a');
                link.download = 'encoded.png';
                link.href = cvs.toDataURL("image/png");
                link.click();
            } else {
                let binary = "";
                let msg = "";
                for (let i = 0; i < data.length; i += 4) {
                    binary += (data[i] % 2 !== 0) ? "1" : "0";
                    if (binary.length === 8) {
                        let char = String.fromCharCode(parseInt(binary, 2));
                        msg += char;
                        binary = "";
                        if (msg.endsWith("###")) break;
                    }
                }
                document.getElementById('output').innerText = msg.replace("###", "");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
